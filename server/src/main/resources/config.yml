# ---------------------------------------------------------------------------
#  CorePvP - main configuration
#
#  Message text lives in messages.yml, ranks in ranks.yml, kits in kits.yml
#  and arenas in arenas.yml. Reload everything with /corepvp reload.
# ---------------------------------------------------------------------------

server:
  # Shown on scoreboards and in some messages.
  name: "CorePvP"

storage:
  # SQLITE needs no setup at all and keeps everything in one file.
  # MYSQL is there for when you outgrow that.
  type: SQLITE

  sqlite:
    # Relative to the plugin folder.
    file: "data.db"

  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "corepvp"
    username: "root"
    password: ""
    pool-size: 10
    properties: "useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8"

profiles:
  # How often cached profiles with unsaved changes are flushed to storage.
  autosave-interval-seconds: 300
  # Kick players whose profile failed to load rather than letting them play
  # with a blank one (which would later overwrite their real stats).
  kick-on-load-failure: true

worlds:
  # These are created on first start if they do not exist. The lobby, arena and
  # FFA worlds are pure void; survival uses normal generation.
  lobby: "world"
  arenas: "world_arenas"
  ffa: "world_ffa"
  survival: "world_survival"
  create-survival: true

lobby:
  # Set in game with /corepvp setspawn. Empty means "use the lobby world spawn".
  spawn: ""

chat:
  format: "<rank_prefix><player><dark_gray>: <gray><message>"
  # 0 disables the cooldown. Bypass with corepvp.chat.bypass-cooldown.
  cooldown-seconds: 0

scoreboard:
  enabled: true
  # 4 ticks is five updates a second, which is plenty and costs nothing
  # because only lines that actually changed are sent.
  update-ticks: 4

arenas:
  # Blocks placed per tick while generating. Higher finishes sooner but eats
  # more of each tick.
  blocks-per-tick: 4000
  # Blocks restored per tick after a match. Deliberately lower: rollback runs
  # while other matches are being played.
  rollback-blocks-per-tick: 2000

match:
  countdown-seconds: 5
  # How long the result stays on screen before players return to the hub.
  end-seconds: 3
  # A match that runs this long is called a draw. 0 disables the limit.
  max-duration-minutes: 15
  # How long after being hit a player still counts as killed by that attacker,
  # so void and fall deaths credit the right person.
  combat-tag-seconds: 10
  # Hits needed to win a boxing match.
  boxing-hits: 100
  # How many finished matches keep their inventories viewable.
  snapshot-cache-size: 200

duel:
  request-expiry-seconds: 30

queue:
  # Ranked pairing: how far apart two ratings may be, widening while waiting.
  elo-range-base: 50
  elo-range-expansion-per-second: 25
  elo-range-max: 5000
  # Base K-factor. Doubled for a player's first ten matches on a kit and
  # halved above 2000, so newcomers settle fast and veterans move slowly.
  k-factor: 32
  # Unranked matches needed on a kit before its ranked queue opens.
  ranked-min-games: 0

leaderboard:
  entries: 30
  refresh-seconds: 60

crystal:
  # How long after placing a crystal its owner is still credited for the blast.
  attribution-seconds: 30
  # Respawn anchors explode without naming a player, so the detonation is
  # matched to a nearby recent one within this window.
  anchor-attribution-seconds: 3
  announce-totems-outside-matches: true
  # Consumables topped up for kits with infinite-items. Only materials the kit
  # already contains are refilled.
  refill-interval-ticks: 20
  refill:
    END_CRYSTAL: 64
    OBSIDIAN: 64
    ENCHANTED_GOLDEN_APPLE: 16
    EXPERIENCE_BOTTLE: 64
    RESPAWN_ANCHOR: 32
    GLOWSTONE: 64

ffa:
  # How far from spawn players cannot be hurt, so nobody is killed the moment
  # they respawn.
  safe-radius: 6.0
  combat-tag-seconds: 15
  # Logging out while tagged counts as a death.
  punish-combat-log: true
  # Refill the killer's kit after a kill, so a good player survives a crowd.
  refill-on-kill: true
  killstreak-milestones: [ 5, 10, 15, 25, 50 ]

party:
  max-size: 8

survival:
  # Set in game with /corepvp setsurvivalspawn. Empty uses the world spawn.
  spawn: ""
  spawn-protection-radius: 24.0
  default-homes: 2
  # More homes are granted with corepvp.homes.<number>.
  tpa-cooldown-seconds: 10

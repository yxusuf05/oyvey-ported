name: CorePvP
version: '${version}'
api-version: '${apiVersion}'
main: me.alpha432.corepvp.CorePvPPlugin
description: Practice PvP core - kits, arenas, queues, duels, FFA, crystal PvP and survival.
website: https://github.com/yxusuf05/oyvey-ported
authors: [ CorePvP ]
folia-supported: false

commands:
  corepvp:
    description: Administrative root command for CorePvP.
    usage: /corepvp help
    aliases: [ cpvp, practice ]
  duel:
    description: Challenge another player.
    usage: /duel <player> [kit]
    aliases: [ 1v1 ]
  spectate:
    description: Watch someone else's match.
    usage: /spectate <player>
    aliases: [ spec ]
  inv:
    description: View a post-match inventory.
    usage: /inv <id> <player>
    aliases: [ inventory ]
  leave:
    description: Leave your current match or stop spectating.
    usage: /leave
  stats:
    description: Show a player's record.
    usage: /stats [player]
  leaderboard:
    description: Show the top players for a kit.
    usage: /leaderboard [kit]
    aliases: [ lb, top ]
  ffa:
    description: Join or manage free-for-all arenas.
    usage: /ffa [join|leave|list]
  party:
    description: Team up with other players.
    usage: /party create|invite|join|leave|list
    aliases: [ p ]
  survival:
    description: Travel to the survival world.
    usage: /survival
  home:
    description: Teleport to one of your homes.
    usage: /home [name]
  homes:
    description: List your homes.
    usage: /homes
  sethome:
    description: Set a home where you stand.
    usage: /sethome [name]
  delhome:
    description: Delete one of your homes.
    usage: /delhome [name]
  tpa:
    description: Ask to teleport to another player.
    usage: /tpa <player>
  tpaccept:
    description: Accept a teleport request.
    usage: /tpaccept
  staff:
    description: Toggle staff mode.
    usage: /staff
    permission: corepvp.staff
  vanish:
    description: Toggle vanish.
    usage: /vanish
    permission: corepvp.staff
  freeze:
    description: Freeze or unfreeze a player.
    usage: /freeze <player>
    permission: corepvp.staff

permissions:
  corepvp.admin:
    description: Full administrative access.
    default: op
    children:
      corepvp.command.admin: true
      corepvp.staff: true
      corepvp.build: true
  corepvp.command.admin:
    description: Access to administrative subcommands.
    default: op
  corepvp.staff:
    description: Staff mode, vanish and freeze.
    default: op
  corepvp.build:
    description: Build in protected areas.
    default: op

name: CorePvP
version: '${version}'
api-version: '${apiVersion}'
main: me.alpha432.corepvp.CorePvPPlugin
description: Practice PvP core - kits, arenas, queues, duels, FFA, crystal PvP and survival.
website: https://github.com/yxusuf05/oyvey-ported
authors: [ CorePvP ]
folia-supported: false

commands:
  corepvp:
    description: Administrative root command for CorePvP.
    usage: /corepvp help
    aliases: [ cpvp, practice ]
  duel:
    description: Challenge another player.
    usage: /duel <player> [kit]
    aliases: [ 1v1 ]
  spectate:
    description: Watch someone else's match.
    usage: /spectate <player>
    aliases: [ spec ]
  inv:
    description: View a post-match inventory.
    usage: /inv <id> <player>
    aliases: [ inventory ]
  leave:
    description: Leave your current match or stop spectating.
    usage: /leave
  stats:
    description: Show a player's record.
    usage: /stats [player]
  leaderboard:
    description: Show the top players for a kit.
    usage: /leaderboard [kit]
    aliases: [ lb, top ]

permissions:
  corepvp.admin:
    description: Full administrative access.
    default: op
    children:
      corepvp.command.admin: true
  corepvp.command.admin:
    description: Access to administrative subcommands.
    default: op

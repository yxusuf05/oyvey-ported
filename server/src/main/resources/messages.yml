# ---------------------------------------------------------------------------
#  CorePvP - all player facing text.
#
#  Formatting uses MiniMessage: https://docs.advntr.dev/minimessage/format.html
#  <prefix> expands to the prefix defined below.
#  Anything a player typed is inserted literally and is never parsed as tags.
# ---------------------------------------------------------------------------

prefix: "<dark_gray>[<gradient:#00d4ff:#0066ff><bold>Core</bold></gradient><dark_gray>] <gray>"

general:
  no-permission: "<prefix><red>You don't have permission to do that."
  player-only: "<prefix><red>That command can only be used in game."
  unknown-subcommand: "<prefix><red>Unknown subcommand '<white><input></white>'. Try <white>/<label> help</white>."
  usage: "<prefix><gray>Usage: <white>/<label> <usage></white>"
  player-not-found: "<prefix><red>No online player named '<white><input></white>'."
  invalid-number: "<prefix><red>'<white><input></white>' is not a valid number."
  reloaded: "<prefix><green>Configuration reloaded <dark_gray>(<white><ms>ms</white>)</green>."
  reload-failed: "<prefix><red>Reload failed: <white><error></white>"
  profile-load-failed: "<red>Your profile could not be loaded, so you were disconnected\nrather than risk overwriting your stats.\n\n<gray>Please try again in a moment."

admin:
  header: "<dark_gray><strikethrough>                    </strikethrough> <gradient:#00d4ff:#0066ff><bold>CorePvP</bold></gradient> <dark_gray><strikethrough>                    </strikethrough>"
  help-entry: "<gray>/<label> <white><usage></white> <dark_gray>- <gray><description>"
  version: "<prefix><gray>Running <white>CorePvP v<version></white> on <white><server></white>."

chat:
  cooldown: "<prefix><red>Slow down - <white><time></white> left."

lobby:
  join: "<dark_gray>[<green>+</green>] <gray><player>"
  quit: "<dark_gray>[<red>-</red>] <gray><player>"
  spawn-set: "<prefix><green>Lobby spawn set to your position."
  no-spawn: "<prefix><red>No lobby spawn is set. Use <white>/corepvp setspawn</white> first."
  teleported: "<prefix><gray>Sent you back to spawn."

  items:
    unranked-queue:
      name: "<green><bold>Unranked</bold>"
      lore:
        - "<gray>Fight without touching your ELO."
        - ""
        - "<yellow>Right click <gray>to pick a kit."
    ranked-queue:
      name: "<aqua><bold>Ranked</bold>"
      lore:
        - "<gray>Every match moves your ELO."
        - ""
        - "<yellow>Right click <gray>to pick a kit."
    ffa:
      name: "<light_purple><bold>Free For All</bold>"
      lore:
        - "<gray>Jump straight into an open arena."
        - "<gray>Crystal, sumo and more."
        - ""
        - "<yellow>Right click <gray>to choose."
    survival:
      name: "<dark_green><bold>Survival</bold>"
      lore:
        - "<gray>The persistent world."
        - ""
        - "<yellow>Right click <gray>to travel."
    kit-editor:
      name: "<gold><bold>Kit Editor</bold>"
      lore:
        - "<gray>Arrange your own hotbar layouts."
        - ""
        - "<yellow>Right click <gray>to edit."
    leaderboard:
      name: "<yellow><bold>Leaderboards</bold>"
      lore:
        - "<gray>The best players per kit."
        - ""
        - "<yellow>Right click <gray>to view."
    party:
      name: "<blue><bold>Party</bold>"
      lore:
        - "<gray>Team up for 2v2 and 3v3."
        - ""
        - "<yellow>Right click <gray>to open."
    settings:
      name: "<white><bold>Settings</bold>"
      lore:
        - "<gray>Scoreboard, requests and visibility."
        - ""
        - "<yellow>Right click <gray>to open."

scoreboard:
  lobby:
    title: "<gradient:#00d4ff:#0066ff><bold>CorePvP</bold></gradient>"
    lines:
      - "<dark_gray><strikethrough>                    </strikethrough>"
      - "<gray>Online: <white><online></white>"
      - "<gray>In fights: <white><fights></white>"
      - "<gray>In queue: <white><queued></white>"
      - ""
      - "<gray>Rank: <white><rank></white>"
      - "<gray>Ping: <white><ping>ms</white>"
      - "<dark_gray><strikethrough>                    </strikethrough>"

  match:
    title: "<gradient:#ff5f6d:#ffc371><bold>Match</bold></gradient>"
    lines:
      - "<dark_gray><strikethrough>                    </strikethrough>"
      - "<gray>Kit: <white><kit></white>"
      - "<gray>Time: <white><duration></white>"
      - ""
      - "<gray>Opponent: <white><opponent></white>"
      - "<gray>Their ping: <white><ping>ms</white>"
      - ""
      - "<gray>Combo: <white><combo></white>"
      - "<dark_gray><strikethrough>                    </strikethrough>"
    boxing-lines:
      - "<dark_gray><strikethrough>                    </strikethrough>"
      - "<gray>Kit: <white><kit></white>"
      - "<gray>Time: <white><duration></white>"
      - ""
      - "<gray>Your hits: <green><your_hits></green>"
      - "<gray>Their hits: <red><their_hits></red>"
      - ""
      - "<gray>Opponent: <white><opponent></white>"
      - "<dark_gray><strikethrough>                    </strikethrough>"

arena:
  generate-usage: "<prefix><gray>Usage: <white>/corepvp arena generate <template> [count]</white> <dark_gray>- <gray>templates: <white><templates></white>"
  unknown-template: "<prefix><red>Unknown template '<white><input></white>'. Available: <white><templates></white>"
  bad-count: "<prefix><red>Generate between 1 and 64 arenas at a time."
  no-world: "<prefix><red>The arena world is not loaded."
  generating: "<prefix><gray>Generating <white><count></white> <white><template></white> arena(s)..."
  generated: "<prefix><green>Generated <white><count></white> arena(s): <gray><arenas>"
  none: "<prefix><gray>No arenas yet. Try <white>/corepvp arena generate crystal 4</white>."
  list-header: "<prefix><gray>Arenas <dark_gray>(<white><count></white>)"
  list-entry: "<dark_gray> - <white><id> <dark_gray>| <gray><template> <dark_gray>| <gray><state>"
  not-found: "<prefix><red>No arena named '<white><input></white>'."
  tp-usage: "<prefix><gray>Usage: <white>/corepvp arena tp <id></white>"
  teleported: "<prefix><gray>Teleported to <white><id></white>."
  delete-usage: "<prefix><gray>Usage: <white>/corepvp arena delete <id></white>"
  deleted: "<prefix><green>Deleted arena <white><id></white>."

kit:
  none: "<prefix><gray>No kits are configured."
  list-header: "<prefix><gray>Kits <dark_gray>(<white><count></white>)"
  list-entry: "<dark_gray> - <white><id> <dark_gray>| <gray><combat> <dark_gray>| <gray><arenas>"
  not-found: "<prefix><red>No kit named '<white><input></white>'."
  give-usage: "<prefix><gray>Usage: <white>/corepvp kit give <id></white>"
  given: "<prefix><gray>Gave you the <white><name></white> kit."
  save-usage: "<prefix><gray>Usage: <white>/corepvp kit save <id></white>"
  saved: "<prefix><green>Saved your inventory as the <white><name></white> kit."

match:
  start-title: "<gradient:#00d4ff:#0066ff><bold><kit></bold></gradient>"
  start-subtitle: "<gray>vs <white><opponent></white>"
  countdown: "<prefix><gray>Starting in <white><seconds></white>..."
  begin: "<prefix><green><bold>Fight!</bold>"
  death: "<prefix><white><player></white> <gray>died."
  killed: "<prefix><white><player></white> <gray>was killed by <white><killer></white> <dark_gray>(<red><health>❤</red><dark_gray>)"
  disconnected: "<prefix><white><player></white> <gray>disconnected."
  result: "<prefix><green><winner></green> <gray>beat <red><loser></red> <dark_gray>(<gray><duration><dark_gray>)"
  draw: "<prefix><gray>The match ended in a draw."
  time-limit: "<prefix><gray>Time limit reached."
  inventories: "<prefix><gray>Inventories: <players>"
  inventory-hover: "<gray>Show <white><player></white>'s final inventory"
  spectator-joined: "<prefix><gray><player> is now spectating."
  left: "<prefix><gray>You left the match."
  nothing-to-leave: "<prefix><red>You are not in a match."

spectate:
  usage: "<prefix><gray>Usage: <white>/spectate <player></white>"
  not-in-lobby: "<prefix><red>You can only start spectating from the hub."
  not-fighting: "<prefix><red><player> is not in a match."
  disabled: "<prefix><red><player> has spectators turned off."
  left: "<prefix><gray>Stopped spectating."

duel:
  usage: "<prefix><gray>Usage: <white>/duel <player> [kit]</white>"
  accept-usage: "<prefix><gray>Usage: <white>/duel accept <player></white>"
  self: "<prefix><red>You cannot duel yourself."
  busy: "<prefix><red>Either you or <white><player></white> is not in the hub."
  disabled: "<prefix><red><player> has duel requests turned off."
  sent: "<prefix><gray>Challenged <white><player></white> to <white><kit></white>."
  received: "<prefix><white><player></white> <gray>challenged you to <white><kit></white>. <yellow>/duel accept <player></yellow> <dark_gray>(<seconds>s)"
  none: "<prefix><red>No pending challenge from <white><player></white>."
  kit-gone: "<prefix><red>That kit no longer exists."
  no-arena: "<prefix><red>No free <white><kit></white> arena right now - try again in a moment."

snapshot:
  usage: "<prefix><gray>Usage: <white>/inv <id> <player></white>"
  expired: "<prefix><red>That match is no longer available."
  no-player: "<prefix><red>'<white><input></white>' was not in that match. Players: <white><players></white>"
  title: "<dark_gray><player>'s inventory"
  summary-name: "<yellow><bold><player></bold>"
  summary-lore:
    - "<gray>Kit: <white><kit></white>"
    - "<gray>Result: <white><result></white>"
    - ""
    - "<gray>Health: <red><health>❤</red>"
    - "<gray>Hits: <white><hits></white> <dark_gray>(longest combo <white><combo></white>)"
    - "<gray>Potions: <white><potions></white> <dark_gray>(<white><accuracy>%</white> accurate)"
    - "<gray>Crystals: <white><crystals></white>"
    - "<gray>Totems popped: <white><totems></white>"
  won: "Won"
  lost: "Lost"

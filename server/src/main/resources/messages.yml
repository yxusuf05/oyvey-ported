# ---------------------------------------------------------------------------
#  CorePvP - all player facing text.
#
#  Formatting uses MiniMessage: https://docs.advntr.dev/minimessage/format.html
#  <prefix> expands to the prefix defined below.
#  Anything a player typed is inserted literally and is never parsed as tags.
# ---------------------------------------------------------------------------

prefix: "<dark_gray>[<gradient:#00d4ff:#0066ff><bold>Core</bold></gradient><dark_gray>] <gray>"

general:
  no-permission: "<prefix><red>You don't have permission to do that."
  player-only: "<prefix><red>That command can only be used in game."
  unknown-subcommand: "<prefix><red>Unknown subcommand '<white><input></white>'. Try <white>/<label> help</white>."
  usage: "<prefix><gray>Usage: <white>/<label> <usage></white>"
  player-not-found: "<prefix><red>No online player named '<white><input></white>'."
  invalid-number: "<prefix><red>'<white><input></white>' is not a valid number."
  reloaded: "<prefix><green>Configuration reloaded <dark_gray>(<white><ms>ms</white>)</green>."
  reload-failed: "<prefix><red>Reload failed: <white><error></white>"
  profile-load-failed: "<red>Your profile could not be loaded, so you were disconnected\nrather than risk overwriting your stats.\n\n<gray>Please try again in a moment."

admin:
  header: "<dark_gray><strikethrough>                    </strikethrough> <gradient:#00d4ff:#0066ff><bold>CorePvP</bold></gradient> <dark_gray><strikethrough>                    </strikethrough>"
  help-entry: "<gray>/<label> <white><usage></white> <dark_gray>- <gray><description>"
  version: "<prefix><gray>Running <white>CorePvP v<version></white> on <white><server></white>."

chat:
  cooldown: "<prefix><red>Slow down - <white><time></white> left."

lobby:
  join: "<dark_gray>[<green>+</green>] <gray><player>"
  quit: "<dark_gray>[<red>-</red>] <gray><player>"
  spawn-set: "<prefix><green>Lobby spawn set to your position."
  no-spawn: "<prefix><red>No lobby spawn is set. Use <white>/corepvp setspawn</white> first."
  teleported: "<prefix><gray>Sent you back to spawn."

  items:
    unranked-queue:
      name: "<green><bold>Unranked</bold>"
      lore:
        - "<gray>Fight without touching your ELO."
        - ""
        - "<yellow>Right click <gray>to pick a kit."
    ranked-queue:
      name: "<aqua><bold>Ranked</bold>"
      lore:
        - "<gray>Every match moves your ELO."
        - ""
        - "<yellow>Right click <gray>to pick a kit."
    ffa:
      name: "<light_purple><bold>Free For All</bold>"
      lore:
        - "<gray>Jump straight into an open arena."
        - "<gray>Crystal, sumo and more."
        - ""
        - "<yellow>Right click <gray>to choose."
    survival:
      name: "<dark_green><bold>Survival</bold>"
      lore:
        - "<gray>The persistent world."
        - ""
        - "<yellow>Right click <gray>to travel."
    kit-editor:
      name: "<gold><bold>Kit Editor</bold>"
      lore:
        - "<gray>Arrange your own hotbar layouts."
        - ""
        - "<yellow>Right click <gray>to edit."
    leaderboard:
      name: "<yellow><bold>Leaderboards</bold>"
      lore:
        - "<gray>The best players per kit."
        - ""
        - "<yellow>Right click <gray>to view."
    party:
      name: "<blue><bold>Party</bold>"
      lore:
        - "<gray>Team up for 2v2 and 3v3."
        - ""
        - "<yellow>Right click <gray>to open."
    settings:
      name: "<white><bold>Settings</bold>"
      lore:
        - "<gray>Scoreboard, requests and visibility."
        - ""
        - "<yellow>Right click <gray>to open."

scoreboard:
  lobby:
    title: "<gradient:#00d4ff:#0066ff><bold>CorePvP</bold></gradient>"
    lines:
      - "<dark_gray><strikethrough>                    </strikethrough>"
      - "<gray>Online: <white><online></white>"
      - "<gray>In fights: <white><fights></white>"
      - "<gray>In queue: <white><queued></white>"
      - ""
      - "<gray>Rank: <white><rank></white>"
      - "<gray>Ping: <white><ping>ms</white>"
      - "<dark_gray><strikethrough>                    </strikethrough>"

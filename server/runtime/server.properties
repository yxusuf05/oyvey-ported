# CorePvP - server.properties tuned for PvP.
# Copied into run/ by scripts/setup.sh and never overwritten afterwards.

motd=§b§lCorePvP §8| §fPractice §8• §fCrystal §8• §fSurvival
server-port=25565
max-players=200

# Keep this true unless you are testing with offline accounts. If you switch it
# off, do not expose the server to the internet.
online-mode=true
enforce-secure-profile=false

# The plugin creates and manages its own worlds; the default world is only the
# container the server insists on having.
level-name=world
level-type=minecraft:flat
generator-settings={"layers":[],"biome":"minecraft:the_void"}
generate-structures=false
allow-nether=false
gamemode=adventure
force-gamemode=false
difficulty=normal

pvp=true
spawn-protection=0
allow-flight=true
spawn-monsters=false
spawn-npcs=false
spawn-animals=false

# Arenas are tiny and adjacent; there is nothing to gain from a large view.
view-distance=6
simulation-distance=4
entity-broadcast-range-percentage=100

network-compression-threshold=256
sync-chunk-writes=false
max-tick-time=60000
enable-command-block=false
enable-query=false
enable-rcon=false
white-list=false

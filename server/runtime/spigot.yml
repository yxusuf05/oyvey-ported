# CorePvP - Spigot tuning.
#
# Only the values that differ from the defaults are listed; Spigot adds the
# rest on first start.
config-version: 12

settings:
  bungeecord: false
  save-user-cache-on-stop-only: true
  moved-wrongly-threshold: 0.0625
  moved-too-quickly-multiplier: 100.0

world-settings:
  default:
    mob-spawn-range: 0
    # Dropped items from a finished match are cleaned up by the plugin, but a
    # short despawn keeps stragglers from piling up in FFA arenas.
    item-despawn-rate: 300
    arrow-despawn-rate: 200
    # Merging thrown potions or splash residue would be visible to players.
    merge-radius:
      item: 0.5
      exp: -1
    entity-activation-range:
      animals: 8
      monsters: 8
      raiders: 8
      misc: 4
      water: 8
      villagers: 8
      flying-monsters: 8
    hopper-transfer: 8
    hopper-check: 8
    max-tnt-per-tick: 100

# CorePvP - bukkit.yml
# Mob spawning is off everywhere: nothing in this server needs it, and every
# entity that does not exist is a tick we get to spend on combat instead.

settings:
  allow-end: false
  warn-on-overload: true
  permissions-file: permissions.yml
  update-folder: update
  plugin-profiling: false
  connection-throttle: 2000
  query-plugins: false
  deprecated-verbose: false
  shutdown-message: "§cServer restarting."
  minimum-api: none
  use-map-color-cache: true

spawn-limits:
  monsters: 0
  animals: 0
  water-animals: 0
  water-ambient: 0
  water-underground-creature: 0
  axolotls: 0
  ambient: 0

chunk-gc:
  period-in-ticks: 400

ticks-per:
  animal-spawns: -1
  monster-spawns: -1
  water-spawns: -1
  water-ambient-spawns: -1
  water-underground-creature-spawns: -1
  axolotl-spawns: -1
  ambient-spawns: -1
  # Arena worlds do not need saving; profiles live in the database.
  autosave: -1

aliases: now-in-commands.yml

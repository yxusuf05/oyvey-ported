# Practice kits.
#
# build          players may place and break blocks inside the arena bounds
# hunger         hunger drains during the fight
# damage-ticks   invulnerability ticks after a hit; 20 is vanilla, 0 is 1.8 style
# boxing         first to hits-to-win landed hits wins, damage is ignored
# sumo           no damage, whoever drops below void-level loses
# void-level     Y below which a player counts as dead; leave out to disable
#
# Items use the same syntax as the SMP kits: "MATERIAL:amount" or the long form.

kits:

  nodebuff:
    display-name: "<red>NoDebuff"
    icon: POTION
    slot: 0
    ranked: true
    damage-ticks: 20
    items:

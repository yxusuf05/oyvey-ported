name: CorePvP server build

# Separate from the client mod workflow: the server is its own Gradle build,
# and a failure in one should never mask the other.
on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/server-build.yml'
  pull_request:
    paths:
      - 'server/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x server/gradlew

      - name: Build and test
        run: ./gradlew build --no-daemon
        working-directory: server

      - uses: actions/upload-artifact@v4
        with:
          name: CorePvP
          path: server/build/libs/CorePvP-*.jar
          if-no-files-found: error
          retention-days: 30

name: game

on:
  push:
    paths:
      - 'game/**'
      - '.github/workflows/game.yml'
  pull_request:
    paths:
      - 'game/**'
      - '.github/workflows/game.yml'

defaults:
  run:
    working-directory: game

jobs:
  check:
    name: typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: game/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

  e2e:
    name: browser tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: game/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # GitHub runners have no preinstalled browser, unlike the dev container, so this
      # download is required here and must not be skipped.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: game/playwright-report/
          retention-days: 14
